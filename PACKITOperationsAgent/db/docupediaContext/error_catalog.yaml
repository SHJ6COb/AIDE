# PackIT (PD7) Interface Error Catalog
# Transcribed from: "PackIT (PD7) Interface Error- General Hints to resolve-v15-20260804_083926.pdf"
# Author: Jahed Ali Shaik (BD/TOA-SPL3)
#
# Matching rule (see docs/components/catalog/TECHNICAL_SPEC.md): try each row's `pattern`
# (a case-insensitive regex against the joined, newline-separated error description text)
# in file order — first match wins. Rows are ordered most-specific-first so a generic
# pattern doesn't shadow a more specific one that should take priority (e.g. rows with
# "in plant" come before their plant-independent counterparts).
#
# `context`, when present, means the pattern alone is not sufficient — the row only
# applies when the given SearchParams/TransferRecord fields also match (e.g. row 7 is a
# special case only for a specific Plant+DeterminationType+CustomerIndex combination).
# The matcher should treat `context` as an additional required condition, not optional.
#
# Rows with `pattern: null` are background/policy notes from the document (not tied to
# one specific error string) — kept for reference and for the two rows (5, 29) that
# inform status derivation (see docs/components/transform/TECHNICAL_SPEC.md), not meant
# to be matched against live error text.
#
# `error_category` values: "Target Error", "Source Error", "Technical Error", "HINT",
# "No action required", "Retrigger required" — see docs/components/catalog/TECHNICAL_SPEC.md
# for how these map onto the dashboard's 5 Replication Status buckets.

- seq_nr: 15
  error_category: "Target Error"
  pattern: "T141 Bom item status Invalid for material"
  responsible: "Plant"
  summary: "The affected packaging material has an invalid plant status on the target SAP system."
  solution: "Change the packaging material's plant status to 40 (valid) on the mentioned SAP system, or use a different packaging material in the PackSpec."

- seq_nr: 45
  error_category: "Target Error"
  pattern: "T141 Bom header status Invalid for material"
  responsible: "Plant"
  summary: "The affected product has an invalid plant status (50, 11, or not maintained) on the target SAP system."
  solution: "Change the product's plant status to 40 (valid) on the mentioned SAP system."

- seq_nr: 16
  error_category: "Target Error"
  pattern: "Material status 50 '(Invalid|Blocked)' is not selected for BOM item"
  responsible: "Plant"
  summary: "Probably the 15-digit PSTE number is invalid."
  solution: "Check the 15-digit PSTE material master (10-digit product number, index, and 'PS'). Correction of the x-plant or plant specific status must be done by the plant."

- seq_nr: 1
  error_category: "Target Error"
  # Loosened 2026-08-04: confirmed live that the real Ret_msgs.Message text is just
  # "SNR13 Cross Plant Status Invalid" (268 real occurrences in one 3h sample) — the
  # "FAIL:" prefix and "- Z0MM_XMARA" suffix from the source PDF never actually appear
  # in production; made optional rather than removed so the fuller documented form still
  # matches too. See docs/components/catalog/TECHNICAL_SPEC.md.
  pattern: "(FAIL:\\s*)?SNR1[03]\\s*CROSS PLANT STATUS INVALID(\\s*-\\s*Z0MM_XMARA)?"
  responsible: "Plant"
  summary: "The affected 10- or 13-digit number has an invalid X-plant (cross-plant) status on the mentioned SAP system."
  solution: "Change the X-plant status to 40 (valid) on the mentioned SAP system. If the invalid status is actually correct, delete the Determination Record (and consider deleting the PackSpec if no other DR references it) and inform the PST Team via mServiceHub to cancel the failed transfer."

- seq_nr: 3
  error_category: "Target Error"
  # Loosened 2026-08-04: confirmed live that the real Ret_msgs.Message text is just
  # "SNR13 Plant Status Invalid" (95 real occurrences in one 3h sample) — same scaffolding
  # mismatch as seq_nr 1/2. See docs/components/catalog/TECHNICAL_SPEC.md.
  pattern: "(FAIL:\\s*)?SNR1[03]\\s*PLANT STATUS INVALID(\\s*-\\s*Z0MM_XMARC)?"
  responsible: "Plant"
  summary: "The affected 10- or 13-digit number has an invalid plant-specific status on the mentioned SAP system."
  solution: "Change the plant-specific status to 40 (valid) on the related SAP system. If the invalid status is correct, delete the Determination Record (and consider the PackSpec too) and inform the PST Team via mServiceHub."

- seq_nr: 4
  error_category: "Target Error"
  pattern: "FAIL:\\s*SNR1[03]\\s*NOT FOUND/?\\s*PLANT STATUS INVALID/?\\s*MARK FOR DELETION\\s*-\\s*Z0MM_XMARC"
  responsible: "Plant"
  summary: "The needed plant view for the affected 10-/13-digit number is not created, or a plant-level deletion flag is set."
  solution: "Create the missing plant view, or remove the deletion flag (also check x-plant and plant status validity). If the deletion flag is correct, delete the Determination Record (and consider the PackSpec)."

- seq_nr: 7
  error_category: "Retrigger required"
  pattern: "SNR13 NOT FOUND/?\\s*STATUS EMPTY/?\\s*MARK FOR DELETION\\s*-\\s*Z0MM_XMARA\\s*-\\s*(P81|POE)"
  context:
    plant: "8160"
    determination_type: "ZFER"
    customer_index: "110"
    sales_channel: "OE"
  responsible: "Support Team"
  summary: "Special case for plant 8150/8160 (EhP) with this exact Sales Channel/Determination Type/Index/Plant combination — a Buffer Monitoring Task, not the generic SNR13-not-found case."
  solution: "Cancel the stuck entries (Support Team)."

- seq_nr: 2
  error_category: "Target Error"
  # Loosened 2026-08-04: confirmed live that the real Ret_msgs.Message text is just
  # "SNR13 not found/ Mark for deletion" (429 real occurrences in one 3h sample, the
  # single most common real error seen) — "STATUS EMPTY" and the "- Z0MM_XMARA" suffix
  # from the source PDF never actually appear; both made optional rather than removed.
  # See docs/components/catalog/TECHNICAL_SPEC.md.
  pattern: "SNR1[03]\\s*NOT FOUND/?\\s*(STATUS EMPTY/?\\s*)?MARK FOR DELETION(\\s*-\\s*Z0MM_XMARA)?"
  responsible: "Plant"
  summary: "The affected 10- or 13-digit number is either not created at all on the mentioned SAP system, or a client-level deletion flag is set."
  solution: "Create the missing number, or remove the deletion flag (also check valid x-plant and plant status). If the deletion flag is correct, delete the Determination Record (and consider the PackSpec) and inform the PST Team via mServiceHub."

