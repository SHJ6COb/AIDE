  multiline: true
  responsible: null
  summary: "The interface tried to add a packaging instruction into a Determination Record slot (e.g. Alternative 1) that's already occupied by a different one."
  solution: "Check the POF entries and naming convention (see the Determination Record / Packaging Instruction naming table); verify whether a packaging instruction was created manually. Inform the BBM community to retrigger the failed transfer."

- seq_nr: 31
