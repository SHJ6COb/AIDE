  responsible: null
  summary: "The interface tried to add an alternative packaging instruction (e.g. ...PA1) to a Determination Record, but no POF entry exists at all for the related 13-digit number yet — often because the Regular packaging's POF/POP transfer never completed, or Regular and Alternative were created at the same time."
  solution: "Check whether the Regular packaging's PS was fully transferred (POF/POP created) first; retrigger it if not, then retrigger the alternative. Inform the BBM community to retrigger the failed transfer."

