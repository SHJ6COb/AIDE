# --- Deliberately low-priority: these patterns are themselves SUCCESS phrases
# ("...updated successfully", "Succesfuly changed the PI") that can appear as a trailing
# sub-message even in an otherwise-failed multi-message description (confirmed: example3's
# real error text ends with two "Succesfuly changed the PI" lines despite being an overall
# Business Error caused by an earlier formatting problem, matched by row 31 above). Kept
# last so a real problem pattern earlier in the same text always wins the match first.

- seq_nr: 24
  error_category: "Target Error"
  pattern: "MARA / MARM data has been updated in database succes?fully|Succes?fu?ly changed the PI"
  responsible: null
  summary: "Probably a packaging instruction with a deletion flag set. Only apply this row if nothing else in the description matched — this pattern is itself a success message that can trail a real error in a concatenated multi-line description."
  solution: "Use TC POP3 to check the mentioned packaging instruction; if a deletion flag is shown, remove it with TC POP4. Contact 'BBM PST O2C Packaging @ Support Community' if this isn't the right fix."

- seq_nr: 41
